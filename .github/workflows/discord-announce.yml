# Copied from ajkatz/discord-hub templates/discord-announce.yml.
# Secrets in this repo: DISCORD_WEBHOOK_URL (required),
# ANTHROPIC_API_KEY (optional; without it the post is a plain commit list).
name: Announce pushes to Discord

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: discord-announce-${{ github.ref }}
  cancel-in-progress: false

jobs:
  announce:
    uses: ajkatz/discord-hub/.github/workflows/announce.yml@main
    with:
      project_name: "Goal Planner"
      project_description: "Goal Planner is a RuneLite (Old School RuneScape) plugin that lets players set, track, and share goals - skill levels and XP, boss kill counts, quests, achievement diaries, combat achievements, and item grinds - including repeatable daily/weekly/monthly goals and shareable goal plans."
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
